<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Marketing Heist · Mission Control</title>
<style>
:root{
  --bg:#07090d;--panel:#10151e;--line:#222a37;--line2:#334055;
  --text:#f3f5f8;--soft:#cfd6e0;--dim:#97a2b3;--faint:#5b6677;
  --red:#e5322d;--red2:#ff4b3e;--ok:#4fd1a1;
  --display:"Bahnschrift","DIN Alternate","DIN Condensed","Segoe UI",system-ui,sans-serif;
  --body:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:"Cascadia Mono","Consolas","SF Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden}
body.idle,body.idle *{cursor:none!important}
#fsBtn{position:fixed;top:10px;right:10px;z-index:1000;width:28px;height:28px;display:grid;place-items:center;border:0;background:transparent;color:#cfd6e0;cursor:pointer;padding:0;opacity:.35;transition:opacity .3s,color .2s}
#fsBtn:hover{opacity:.9;color:#fff}
#fsBtn:focus-visible{outline:2px solid #ff4b3e;outline-offset:2px}
#fsBtn svg{width:16px;height:16px}
#fsBtn .exit{display:none}
body.fs #fsBtn .enter{display:none}
body.fs #fsBtn .exit{display:block}
body.idle #fsBtn{opacity:0;pointer-events:none}

/* ---------- 1920x1080 STAGE ---------- */
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;color:var(--text);font-family:var(--body);
  background:radial-gradient(1300px 760px at 88% -12%,rgba(229,50,45,.15),transparent 62%),radial-gradient(900px 620px at -8% 112%,rgba(229,50,45,.07),transparent 60%),linear-gradient(#0a0d13,#05070a);transition:background .6s}
#stage::before{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);background-size:64px 64px;
  -webkit-mask-image:radial-gradient(ellipse at center,#000 25%,transparent 80%);mask-image:radial-gradient(ellipse at center,#000 25%,transparent 80%)}
#stage::after{content:"";position:absolute;left:0;right:0;top:-220px;height:200px;pointer-events:none;background:linear-gradient(transparent,rgba(255,255,255,.03),transparent);animation:scan 10s linear infinite}
@keyframes scan{to{transform:translateY(1500px)}}
#stage.alert{background:radial-gradient(1400px 900px at 50% 0%,rgba(229,50,45,.32),transparent 65%),radial-gradient(1000px 700px at 50% 120%,rgba(229,50,45,.18),transparent 60%),linear-gradient(#1a0607,#090303)}
#stage.alert #hud{border-color:rgba(229,50,45,.55)}
#stage.flash #screen{animation:flash .9s ease-out}
@keyframes flash{0%{filter:brightness(1.8)}100%{filter:none}}

/* ---------- HUD ---------- */
#hud{position:absolute;left:96px;right:96px;top:36px;height:80px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);z-index:2;transition:opacity .4s}
#stage.nohud #hud{opacity:0}
.hud-l{display:flex;align-items:center;gap:18px}
.hud-l .mark{min-width:54px;height:58px;display:grid;place-items:center}
.hud-l .mark img{max-width:96px;max-height:58px;filter:drop-shadow(0 0 1px rgba(255,255,255,.55))}
.wm{font:700 26px/1 var(--display);letter-spacing:.22em}
.wm-sub{font:500 15px/1 var(--mono);letter-spacing:.2em;color:var(--dim);margin-top:8px}
.hud-r{display:flex;align-items:center;gap:30px}
.phase-label{font:600 20px/1 var(--mono);letter-spacing:.22em;color:var(--soft);text-transform:uppercase}
.segs{display:flex;gap:6px}
.segs i{width:30px;height:8px;background:#232b38}
.segs i.past{background:#6a2422}
.segs i.now{background:var(--red);box-shadow:0 0 14px var(--red)}
.clock{font:600 22px/1 var(--mono);color:var(--dim);letter-spacing:.08em;min-width:110px;text-align:right}

/* ---------- SCREEN ---------- */
#screen{position:absolute;left:96px;right:96px;top:156px;bottom:64px;z-index:1}
#stage.nohud #screen{top:64px}
.scr{height:100%}
.rise{opacity:0;animation:rise .75s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(var(--i,0)*95ms)}
@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}

.eyebrow{font:600 24px/1 var(--mono);letter-spacing:.3em;text-transform:uppercase;color:var(--red2);display:flex;align-items:center;gap:16px}
.eyebrow::before{content:"";width:14px;height:14px;background:var(--red);box-shadow:0 0 12px var(--red)}
h1{font:700 104px/.96 var(--display);text-transform:uppercase;letter-spacing:-.005em;margin:26px 0 0}
h1.md{font-size:84px}
.red{color:var(--red2)}
.lead{font-size:34px;line-height:1.38;color:var(--soft);margin:28px 0 0;max-width:1080px}

.panel{position:relative;background:linear-gradient(180deg,rgba(21,27,38,.92),rgba(12,16,23,.92));border:1px solid var(--line2)}
.panel::before,.panel::after{content:"";position:absolute;width:26px;height:26px;border:3px solid var(--red);pointer-events:none}
.panel::before{left:-2px;top:-2px;border-right:0;border-bottom:0}
.panel::after{right:-2px;bottom:-2px;border-left:0;border-top:0}

.split{display:grid;grid-template-columns:minmax(0,1fr) 600px;gap:80px;align-items:center}
.stack{display:flex;flex-direction:column;gap:40px}
.head{display:grid;grid-template-columns:1fr 540px;gap:64px;align-items:center}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}

/* ---------- TIMER ---------- */
.tpanel{padding:44px 44px 48px;display:flex;flex-direction:column;gap:22px}
.tstate{font:600 22px/1 var(--mono);letter-spacing:.3em;text-transform:uppercase;color:var(--dim);display:flex;align-items:center;gap:14px}
.tstate::before{content:"";width:14px;height:14px;border-radius:50%;background:var(--faint)}
.tpanel.run .tstate::before{background:var(--ok);box-shadow:0 0 12px var(--ok);animation:pulse 1.4s ease-in-out infinite}
.tpanel.done .tstate::before,.tpanel.warn .tstate::before{background:var(--red2);box-shadow:0 0 12px var(--red2)}
.tdisp{font:700 176px/1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.01em;color:#fff;white-space:nowrap}
.tpanel.idle .tdisp{color:#c9d0da}
.tpanel.warn .tdisp{color:var(--red2)}
.tpanel.done .tdisp{color:var(--red2);animation:blink 1s steps(2,start) infinite}
.tbar{height:10px;background:#1d2430;overflow:hidden}
.tbar i{display:block;height:100%;width:100%;background:var(--red);transition:width .3s linear}
.tpanel.compact{padding:30px 38px 34px;gap:16px}
.tpanel.compact .tdisp{font-size:144px}
.tcrew{font:600 24px/1.25 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
.tpanel.huge{background:none;border:0;padding:0;align-items:center;gap:26px;margin-top:30px}
.tpanel.huge::before,.tpanel.huge::after{display:none}
.tpanel.huge .tdisp{font-size:360px}
.tpanel.huge .tbar{width:1100px;height:12px}
@keyframes blink{50%{opacity:.25}}
@keyframes pulse{50%{opacity:.35}}

/* ---------- STANDBY / COMPLETE ---------- */
.logo-lg{display:flex;align-items:center;justify-content:center;gap:56px}
.logo-lg img{max-width:1300px;max-height:560px;margin:-9% 0;filter:drop-shadow(0 0 1px rgba(255,255,255,.35)) drop-shadow(0 0 60px rgba(229,50,45,.28))}
.ph-word{text-align:left}
.ph-word .w1{font:600 46px/1 var(--mono);letter-spacing:.62em;color:var(--soft)}
.ph-word .w2{font:700 230px/.86 var(--display);letter-spacing:.02em;margin-top:14px}
.logo-lg.sm{gap:36px}
.logo-lg.sm .ph-word .w1{font-size:28px}
.logo-lg.sm .ph-word .w2{font-size:140px;margin-top:8px}
.tagline{font:600 34px/1 var(--mono);letter-spacing:.42em;text-transform:uppercase;color:var(--red2);margin-top:56px}
.standby-status{position:absolute;left:0;right:0;bottom:104px;justify-content:center;font:600 26px/1 var(--mono);letter-spacing:.34em;text-transform:uppercase;color:var(--dim);display:flex;align-items:center;gap:18px}
.dot{width:16px;height:16px;border-radius:50%;background:var(--red);box-shadow:0 0 16px var(--red);animation:pulse 1.6s ease-in-out infinite}
.foot{position:absolute;left:0;right:0;bottom:0;text-align:center;font:500 20px/1 var(--mono);letter-spacing:.26em;color:var(--faint);text-transform:uppercase}
.dial .ring{transform-origin:100px 100px;animation:spin 60s linear infinite}
.dial .needle{transform-origin:100px 100px;animation:needle 7s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes needle{0%,100%{transform:rotate(-40deg)}30%{transform:rotate(70deg)}60%{transform:rotate(15deg)}}

/* ---------- BRIEFING ---------- */
.rules{margin-top:48px;border-left:6px solid var(--red);padding:22px 0 22px 34px;background:linear-gradient(90deg,rgba(229,50,45,.12),transparent 80%)}
.rules-h{font:600 22px/1 var(--mono);letter-spacing:.3em;text-transform:uppercase;color:var(--red2)}
.rules-row{display:flex;gap:36px;margin-top:16px;font:700 34px/1.1 var(--display);text-transform:uppercase;flex-wrap:wrap}
.plan{padding:40px 44px}
.plan-h{font:600 22px/1 var(--mono);letter-spacing:.26em;text-transform:uppercase;color:var(--dim);padding-bottom:22px;border-bottom:1px solid var(--line2)}
.plan ol{list-style:none;margin:0;padding:0}
.plan li{display:grid;grid-template-columns:62px 1fr auto;align-items:baseline;padding:17px 0;border-bottom:1px solid var(--line)}
.plan li:last-child{border-bottom:0}
.plan .n{font:600 22px var(--mono);color:var(--red2)}
.plan .nm{font:600 32px/1 var(--display);text-transform:uppercase;letter-spacing:.03em}
.plan .mn{font:500 24px var(--mono);color:var(--dim)}

/* ---------- LISTS / CALLOUTS ---------- */
.intel{list-style:none;margin:40px 0 0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:18px 40px;max-width:1080px}
.intel li{display:flex;align-items:center;gap:20px;font:600 36px/1.15 var(--display);text-transform:uppercase}
.intel li.wide{grid-column:1/-1}
.intel b{font:600 22px var(--mono);color:var(--red2);border:2px solid var(--red);width:52px;height:52px;display:grid;place-items:center;flex:none}
.callout{margin-top:44px;padding:26px 34px;border:1px solid rgba(229,50,45,.55);background:rgba(229,50,45,.1);max-width:1080px}
.callout .ch{font:600 22px/1 var(--mono);letter-spacing:.28em;text-transform:uppercase;color:var(--red2)}
.callout p{margin:14px 0 0;font-size:34px;line-height:1.3}
.callout ol{margin:16px 0 0;padding:0;list-style:none;display:flex;gap:40px;font:700 34px/1.1 var(--display);text-transform:uppercase}
.callout ol span{color:var(--red2);margin-right:12px}

/* ---------- CASE / CREW CARDS ---------- */
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;flex:1}
.card{padding:32px 34px;display:flex;flex-direction:column;gap:14px;transition:all .35s}
.card .no{font:600 22px/1 var(--mono);letter-spacing:.24em;text-transform:uppercase;color:var(--red2)}
.card h3{font:700 44px/1 var(--display);text-transform:uppercase;margin:0}
.card p{font-size:27px;line-height:1.3;color:var(--soft);margin:0}
.cases .card{padding:26px 32px;gap:10px}
.cases .card p{font-size:26px;line-height:1.25}
.crew.active{border-color:var(--red);box-shadow:0 0 0 2px var(--red),0 0 50px rgba(229,50,45,.35);background:linear-gradient(180deg,rgba(70,18,18,.9),rgba(25,10,12,.92))}
.crew.done{opacity:.42}
.crew .tag{margin-top:auto;font:600 20px/1 var(--mono);letter-spacing:.24em;text-transform:uppercase;color:var(--faint)}
.crew.active .tag{color:#fff}
.crew.done .tag{color:var(--ok)}
.chips{display:flex;gap:14px;margin-top:26px;flex-wrap:wrap}
.chips span{font:600 26px/1 var(--display);text-transform:uppercase;letter-spacing:.06em;padding:14px 20px;border:1px solid var(--line2);background:rgba(255,255,255,.03)}
.chips span b{color:var(--red2);margin-right:10px}
.note{display:flex;justify-content:space-between;font:600 24px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.note .hl{color:var(--soft)}

/* ---------- TWIST ---------- */
.badge{display:inline-block;font:700 24px/1 var(--mono);letter-spacing:.3em;text-transform:uppercase;background:var(--red);color:#fff;padding:12px 18px;animation:pulse 1.2s ease-in-out infinite}
.twist h1{font-size:118px;margin-top:28px}
.twist h2{font:700 58px/1 var(--display);text-transform:uppercase;margin:22px 0 0;color:var(--red2)}
.twist .lead{font-size:32px;margin-top:22px}
.nolist{list-style:none;margin:26px 0 0;padding:0;display:flex;flex-direction:column;gap:12px}
.nolist li{font:600 34px/1 var(--display);text-transform:uppercase;display:flex;gap:18px;align-items:center}
.nolist li::before{content:"✕";color:var(--red2);font-weight:700}
.twist .callout{margin-top:30px}
.golist{list-style:none;margin:26px 0 0;padding:0;display:flex;flex-direction:column;gap:14px}
.golist li{font:600 34px/1 var(--display);text-transform:uppercase;display:flex;gap:18px;align-items:center}
.golist b{font:600 20px var(--mono);color:var(--red2);border:2px solid var(--red);width:44px;height:44px;display:grid;place-items:center;flex:none}
.twist .callout ol{gap:34px;font-size:30px;white-space:nowrap}

/* ---------- VAULT ---------- */
.vault{display:flex;gap:26px;flex:1}
.lead.vault-call{margin-top:14px;font-size:30px;color:var(--text)}
.vault .card{flex:1;padding:32px 40px;gap:12px}
.vault .card h3{font-size:60px}
.vault .card p{font-size:36px}
.vault .card .sub{font-size:27px;color:var(--dim);margin-top:auto}
.vault .big{font:700 80px/1 var(--display);color:rgba(229,50,45,.9);display:flex;justify-content:space-between;align-items:flex-start}
.vault .big .mins{font:600 22px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin-top:10px}
.vault[data-focus] .card{opacity:.32}
.vault[data-focus] .card.focus{opacity:1;flex:2.1;border-color:var(--red);box-shadow:0 0 0 2px var(--red),0 0 60px rgba(229,50,45,.3)}
.vault[data-focus] .card.focus h3{font-size:68px}
.vault[data-focus] .card.focus p{font-size:40px}

/* ---------- TAKE / GETAWAY ---------- */
.quote{margin-top:44px;font:600 44px/1.2 var(--display);text-transform:uppercase;padding-left:34px;border-left:6px solid var(--red);max-width:1060px}
.form{margin-top:36px;display:flex;flex-direction:column;gap:30px;max-width:1060px}
.form div{font:600 34px/1 var(--display);text-transform:uppercase;padding-bottom:22px;border-bottom:2px dashed var(--line2);display:flex;gap:20px}
.form b{font:600 24px var(--mono);color:var(--red2)}
.sign{margin-top:44px;font:600 26px/1.4 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}

/* ---------- BREAK ---------- */
.back{font:600 34px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--soft);min-height:34px}

/* ---------- OVERLAYS ---------- */
#alert{position:absolute;inset:0;z-index:50;display:none;place-items:center;overflow:hidden}
#alert.on{display:grid;animation:alertbg .42s steps(1) infinite}
#alert.on.hold{animation:none;background:#5a0907}
#alert.hold h2{animation:none;text-shadow:6px 0 rgba(255,75,62,.6),-6px 0 rgba(72,215,255,.35)}
@keyframes alertbg{0%{background:#160203}50%{background:#6b0b08}}
#alert .stripe{position:absolute;left:-40px;right:-40px;height:64px;background:repeating-linear-gradient(-45deg,var(--red) 0 44px,#111 44px 88px);animation:stripe .8s linear infinite}
#alert .stripe.t{top:70px}#alert .stripe.b{bottom:70px}
@keyframes stripe{to{background-position:124px 0}}
#alert .a-in{text-align:center}
#alert .a-k{font:700 30px/1 var(--mono);letter-spacing:.5em;color:#ffd2cc}
#alert h2{font:700 200px/1 var(--display);letter-spacing:.03em;margin:30px 0;color:#fff;animation:glitch .3s steps(2) infinite}
@keyframes glitch{0%{transform:translate(0);text-shadow:6px 0 var(--red2),-6px 0 #48d7ff}50%{transform:translate(-4px,2px);text-shadow:-8px 0 var(--red2),8px 0 #48d7ff}}
#blank{position:absolute;inset:0;background:#000;z-index:80;display:none}
#blank.on{display:block}
#help{position:absolute;inset:0;z-index:90;background:rgba(3,5,8,.94);display:none;place-items:center}
#help.on{display:grid}
#help .box{width:1180px;padding:56px 64px}
#help h3{font:700 44px var(--display);text-transform:uppercase;margin:0 0 30px;letter-spacing:.06em}
#help dl{display:grid;grid-template-columns:330px 1fr;gap:14px 30px;margin:0;font-size:28px}
#help dt{font:600 26px var(--mono);color:var(--red2)}
#help dd{margin:0;color:var(--soft)}
#help .h-note{margin-top:30px;font:500 22px/1.5 var(--mono);color:var(--dim)}
#toast{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);z-index:95;font:500 18px/1 var(--mono);letter-spacing:.14em;color:var(--dim);background:rgba(10,13,19,.9);border:1px solid var(--line2);padding:12px 18px;opacity:0;transition:opacity .25s;pointer-events:none;text-transform:uppercase}
#toast.on{opacity:1}
#armed{position:absolute;right:18px;bottom:18px;width:12px;height:12px;border-radius:50%;background:var(--red);z-index:95;opacity:0;transition:opacity .15s}
#armed.on{opacity:.85;animation:pulse .5s ease-in-out infinite}
</style>
</head>
<body>
<button id="fsBtn" type="button" aria-label="Toggle full screen" title="Full screen (F)">
  <svg class="enter" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M3 9V3h6M21 9V3h-6M3 15v6h6M21 15v6h-6"/></svg>
  <svg class="exit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M9 3v6H3M15 3v6h6M9 21v-6H3M15 21v-6h6"/></svg>
</button>
<div id="stage" class="nohud">
  <header id="hud">
    <div class="hud-l"><div class="mark" id="hudMark"></div><div><div class="wm">MARKETING HEIST</div><div class="wm-sub" id="hudSub"></div></div></div>
    <div class="hud-r"><div class="phase-label" id="phaseLabel"></div><div class="segs" id="segs"></div><div class="clock" id="clock"></div></div>
  </header>
  <main id="screen" aria-live="polite"></main>
  <div id="alert" aria-hidden="true"><div class="stripe t"></div><div class="a-in"><div class="a-k">⚠ Security breach detected</div><h2>MISSION COMPROMISED</h2><div class="a-k">Incoming transmission</div></div><div class="stripe b"></div></div>
  <div id="help" class="" aria-hidden="true"></div>
  <div id="blank"></div>
  <div id="toast"></div>
  <div id="armed"></div>
</div>
<script>
(function(){
'use strict';

/* =========================================================
   CONFIG — edit here
   ========================================================= */
const CONFIG = {
  logo: 'assets/MH-Logo.png',         // full logo lockup for opening/closing screens
  logoMark: 'assets/logo-mark.png', // small icon for the top bar
  logoHasTagline: true,   // true if the logo artwork already includes "Steal the best ideas in the room"
  event: 'NLC-RISC 2026 Staff Conference',
  session: 'Marketing Functional Area',
  pitchSeconds: 120,
  resumeMinutes: 10,     // a reload within this many minutes resumes where you were; otherwise it starts fresh
  twistAlarmSeconds: 11, // how long the full-screen MISSION COMPROMISED alarm holds before the twist screen
  volume: 0.8,           // master sound level, 0–1 (M key mutes)
  music: 'assets/Sly Minor Motif.mp3', // loops on the opening and closing screens
  musicVolume: 0.36,     // 0–1
  musicFadeIn: 4000,     // ms, when the opening/closing screen appears
  musicFadeOut: 3000,    // ms, when you leave it
  musicLoopFade: 3000,   // ms, fade in/out at the start and end of every loop
  storageKey: 'marketing-heist-mc-v2'
};

const MISSIONS = [
  {title:'Invisible Value', goal:'Plan a 30-day campaign that makes your everyday services impossible to miss.'},
  {title:'Inbox Overload',  goal:'Get the right message to the right person, and get it read.'},
  {title:'The Empty Room',  goal:'Fill the seats at your next training, especially with small members.'},
  {title:'Digital Dust',    goal:'Pick three website fixes that help members most, and decide how you\u2019d tell them.'},
  {title:'Bad Press',       goal:'Plan your first 72 hours of communication.'},
  {title:'One-Person Crew', goal:'Build a repeatable way to prioritize and produce content.'}
];

const VAULT = [
  ['The Big Score','What worked at your organization, and what tool or workflow made it easier?','Campaigns, projects, templates, software, AI. What did you do, and what happened? Show and tell.',20],
  ['The Unsolved Case',"What problem haven't you cracked yet?",'Name it. Someone in this room may have the answer.',10]
];
// Each Vault question has its own clock: 'vault' = question 1, 'vault2' = question 2. Pressing 1/2 switches clocks.

const AGENDA = [['The Briefing',10],['Casing the Joint',10],['The Heist',25],['The Reveal',20],['Intermission',10,false],['The Vault',30],['The Take',10],['The Getaway',5]];
// Phase numbers skip the intermission, so they match the facilitator guide's Operation 01–07
const phaseNo=i=>AGENDA[i][2]===false?null:String(AGENDA.slice(0,i+1).filter(a=>a[2]!==false).length).padStart(2,'0');

const PHASES = [
  {id:'standby',  agenda:-1, timer:0},
  {id:'briefing', agenda:0,  timer:0},
  {id:'casing',   agenda:1,  timer:10*60},
  {id:'heist',    agenda:2,  timer:12*60},
  {id:'twist',    agenda:2,  timer:13*60},
  {id:'reveal',   agenda:3,  timer:CONFIG.pitchSeconds},
  {id:'break',    agenda:4,  timer:10*60},
  {id:'vault',    agenda:5,  timer:VAULT[0][3]*60},
  {id:'take',     agenda:6,  timer:10*60},
  {id:'getaway',  agenda:7,  timer:5*60},
  {id:'complete', agenda:-1, timer:0}
];
const IDX = Object.fromEntries(PHASES.map((p,i)=>[p.id,i]));

/* =========================================================
   STATE (persisted, so a refresh or crash resumes in place)
   ========================================================= */
const stage=document.getElementById('stage'), scr=document.getElementById('screen');
const $=id=>document.getElementById(id);
function freshTimers(){const t={};PHASES.forEach(p=>{if(p.timer)t[p.id]={dur:p.timer,rem:p.timer,end:null,fin:false}});t.vault2={dur:VAULT[1][3]*60,rem:VAULT[1][3]*60,end:null,fin:false};return t}
function freshState(){return {step:0,timers:freshTimers(),crew:-1,done:[],twistFired:false,muted:false,vault:-1}}
let S=freshState();

function load(){
  try{
    if(/[?&]reset\b/.test(location.search)){localStorage.removeItem(CONFIG.storageKey);history.replaceState(null,'',location.pathname)}
    const d=JSON.parse(localStorage.getItem(CONFIG.storageKey)||'null');
    if(!d||typeof d!=='object')return;
    // Restore only a session that was live moments ago (accidental refresh or crash).
    // Anything older, like a rehearsal, opens fresh on the opening screen with every clock full.
    if(!Number.isFinite(d.savedAt)||Date.now()-d.savedAt>CONFIG.resumeMinutes*60000)return;
    if(Number.isInteger(d.step)&&d.step>=0&&d.step<PHASES.length)S.step=d.step;
    if(d.timers&&typeof d.timers==='object'){
      for(const id in S.timers){const t=d.timers[id];if(!t)continue;
        const x=S.timers[id];
        if(Number.isFinite(t.rem))x.rem=Math.max(0,Math.round(t.rem));
        if(Number.isFinite(t.end)&&t.end>Date.now())x.end=t.end;else if(Number.isFinite(t.end)){x.end=null;x.rem=0;x.fin=true}
        if(t.fin)x.fin=true;
      }
    }
    if(Number.isInteger(d.crew)&&d.crew>=-1&&d.crew<MISSIONS.length)S.crew=d.crew;
    if(Array.isArray(d.done))S.done=d.done.filter(n=>Number.isInteger(n)&&n>=0&&n<MISSIONS.length);
    S.twistFired=!!d.twistFired;S.muted=!!d.muted;
    if(Number.isInteger(d.vault)&&d.vault>=-1&&d.vault<VAULT.length)S.vault=d.vault;
  }catch(_){}
}
function save(){S.savedAt=Date.now();try{localStorage.setItem(CONFIG.storageKey,JSON.stringify(S))}catch(_){}}

/* =========================================================
   TIMERS — end-time based; keep running in background if you
   navigate away, so an accidental arrow press loses nothing
   ========================================================= */
const cur=()=>PHASES[S.step];
const curT=()=>(cur().id==='vault'&&S.vault===1)?S.timers.vault2:(S.timers[cur().id]||null);
const rem=t=>t.end?Math.max(0,Math.ceil((t.end-Date.now())/1000)):t.rem;
function tStart(t){if(t.end||t.rem<=0)return;t.end=Date.now()+t.rem*1000;t.fin=false}
function tPause(t){if(!t.end)return;t.rem=rem(t);t.end=null}
function tAdd(t,s){const r=Math.max(0,rem(t)+s);if(t.end){if(r>0)t.end=Date.now()+r*1000;else{t.end=null;t.rem=0}}else t.rem=r;if(r>0)t.fin=false}
function tReset(t){t.end=null;t.rem=t.dur;t.fin=false}
const fmt=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
const clockStr=ms=>new Date(ms).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});

/* =========================================================
   SOUND — synthesized with Web Audio, no files, works offline
   ========================================================= */
let actx=null,master=null;
function ac(){
  if(!actx){try{
    actx=new (window.AudioContext||window.webkitAudioContext)();
    const lp=actx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1800;lp.Q.value=.4;  // rounds off harsh edges
    master=actx.createGain();master.gain.value=CONFIG.volume;master.connect(lp).connect(actx.destination);
  }catch(_){return null}}
  if(actx.state==='suspended')actx.resume();return actx}
// soft envelope: gentle fade in, gentle fade out — no clicks or sudden onsets
function tone(c,type,f0,f1,start,dur,vol,attack,release){
  const o=c.createOscillator(),g=c.createGain();o.type=type;
  o.frequency.setValueAtTime(f0,start);if(f1)o.frequency.exponentialRampToValueAtTime(f1,start+dur);
  g.gain.setValueAtTime(0,start);g.gain.linearRampToValueAtTime(vol,start+attack);
  g.gain.setValueAtTime(vol,Math.max(start+attack,start+dur-release));g.gain.linearRampToValueAtTime(0,start+dur);
  o.connect(g).connect(master);o.start(start);o.stop(start+dur+.05)}
// Twist: a low swell under three soft, falling two-tone pulses
function siren(){if(S.muted)return;const c=ac();if(!c)return;const t=c.currentTime;
  tone(c,'sine',98,0,t,2.8,.10,.6,1.2);
  for(let i=0;i<3;i++){const s=t+.25+i*.8;tone(c,'triangle',523,392,s,.6,.07,.12,.3);tone(c,'sine',262,196,s,.6,.05,.12,.3)}}
// Time's up: a soft two-note bell with a long, natural decay
function chime(){if(S.muted)return;const c=ac();if(!c)return;const t=c.currentTime;
  [[659,0],[880,.35]].forEach(([f,d])=>{tone(c,'sine',f,0,t+d,1.6,.08,.02,1.4);tone(c,'sine',f*2,0,t+d,.9,.015,.02,.8)})}
// Crew select / sound-on: a quiet tick
function blip(){if(S.muted)return;const c=ac();if(!c)return;tone(c,'sine',880,0,c.currentTime,.12,.03,.02,.08)}

/* ---------- Background music (opening + closing screens) ----------
   Two envelopes multiply together:
   - screen fade: rises when you land on the opening/closing screen, falls when you leave
   - loop fade:   every pass through the track fades in at the start and out at the end
   Loudness is mapped on a dB curve so fades sound even to the ear instead of
   "holding, then dropping off a cliff". */
const MUSIC_SCREENS=['standby','complete'];
const music=new Audio(encodeURI(CONFIG.music));music.preload='auto';music.loop=false;music.volume=0;
let mGain=0,mTarget=0,mTimer=null,mLast=0;
const perceptual=g=>g<=0.001?0:Math.pow(10,(g-1)*2.4);           // 0..1 → -48 dB..0 dB
function loopEnv(){
  const d=music.duration,t=music.currentTime;if(!isFinite(d)||!d)return 0;
  const f=Math.min(CONFIG.musicLoopFade/1000,d/4);
  return Math.max(0,Math.min(1,t/f,(d-t)/f));
}
function musicTick(){
  const now=performance.now(),dt=now-mLast;mLast=now;
  if(mTarget>mGain)mGain=Math.min(mTarget,mGain+dt/CONFIG.musicFadeIn);
  else if(mTarget<mGain)mGain=Math.max(mTarget,mGain-dt/CONFIG.musicFadeOut);
  music.volume=Math.max(0,Math.min(1,CONFIG.musicVolume*perceptual(mGain*loopEnv())));
  if(mGain===0&&mTarget===0){music.pause();clearInterval(mTimer);mTimer=null}
}
function startTicker(){if(!mTimer){mLast=performance.now();mTimer=setInterval(musicTick,30)}}
music.addEventListener('ended',()=>{if(mTarget>0){music.currentTime=0;music.play().catch(()=>{})}});  // loop manually so each pass fades
function syncMusic(){
  const want=!S.muted&&MUSIC_SCREENS.includes(cur().id);
  mTarget=want?1:0;
  if(want&&music.paused){
    if(mGain===0){try{music.currentTime=0}catch(_){}}
    music.volume=0;
    music.play().then(startTicker).catch(()=>{mGain=0});              // autoplay blocked: wait silently for first click/key
  }else if(!music.paused)startTicker();
}
['pointerdown','keydown'].forEach(ev=>document.addEventListener(ev,()=>{if(music.paused)syncMusic()},true));

function dial(size,animated){
  let ticks='';
  for(let i=0;i<60;i++){const a=i*6*Math.PI/180,long=i%5===0,r1=long?70:77,r2=86;
    ticks+=`<line x1="${(100+r1*Math.sin(a)).toFixed(1)}" y1="${(100-r1*Math.cos(a)).toFixed(1)}" x2="${(100+r2*Math.sin(a)).toFixed(1)}" y2="${(100-r2*Math.cos(a)).toFixed(1)}" stroke="${long?'#cfd6e0':'#5b6677'}" stroke-width="${long?3:2}"/>`}
  return `<svg class="${animated?'dial':''}" width="${size}" height="${size}" viewBox="0 0 200 200" aria-hidden="true">
    <circle cx="100" cy="100" r="95" fill="none" stroke="#e5322d" stroke-width="4"/>
    <g class="ring">${ticks}</g>
    <circle cx="100" cy="100" r="56" fill="#0d1118" stroke="#334055" stroke-width="3"/>
    <polygon points="100,2 91,-12 109,-12" fill="#e5322d" transform="translate(0,16)"/>
    <g class="needle"><line x1="100" y1="100" x2="100" y2="58" stroke="#ff4b3e" stroke-width="6" stroke-linecap="round"/></g>
    <circle cx="100" cy="100" r="11" fill="#e5322d"/></svg>`;
}

/* =========================================================
   RENDER
   ========================================================= */
function render(){
  const p=cur();
  stage.classList.toggle('nohud',p.agenda<0);
  stage.classList.toggle('alert',p.id==='twist');
  $('phaseLabel').textContent=p.agenda>=0?(phaseNo(p.agenda)?`Phase ${phaseNo(p.agenda)} · ${AGENDA[p.agenda][0]}`:AGENDA[p.agenda][0]):'';
  $('segs').innerHTML=AGENDA.map((_,i)=>`<i class="${i<p.agenda?'past':i===p.agenda?'now':''}"></i>`).join('');
  scr.innerHTML=SCREENS[p.id]();
  scr.querySelectorAll('img[data-logo]').forEach(img=>{
    const fail=()=>{const s=img.closest('.logo-lg');if(s)s.innerHTML=phLogo(p.id==='complete'?.62:1)};
    img.addEventListener('error',fail,{once:true});if(img.complete&&!img.naturalWidth)fail();
  });
  paintTimer(true);
  syncMusic();
}
function renderHud(){
  $('hudSub').textContent=`${CONFIG.event} · ${CONFIG.session}`.toUpperCase();
  const m=$('hudMark');
  if(CONFIG.logoMark){m.innerHTML=`<img src="${esc(CONFIG.logoMark)}" alt="">`;m.querySelector('img').addEventListener('error',()=>{m.innerHTML=dial(54,false)},{once:true})}
  else m.innerHTML=dial(54,false);
}
let lastClock='';
function paintClock(){const c=clockStr(Date.now());if(c!==lastClock){lastClock=c;$('clock').textContent=c}}
function paintTimer(){
  const p=cur(),t=curT();if(!t)return;
  const panel=scr.querySelector('[data-tpanel]');if(!panel)return;
  const rr=rem(t),run=!!t.end,warnAt=p.id==='reveal'?30:60;
  let st=rr===0?"Time's up":run?(p.id==='reveal'?'Now pitching':'In progress'):(rr===t.dur?'Standing by':'Paused');
  if(p.id==='reveal'&&S.crew<0&&!run)st='Awaiting crew';
  panel.classList.toggle('run',run&&rr>0);panel.classList.toggle('warn',rr>0&&rr<=warnAt);
  panel.classList.toggle('done',rr===0);panel.classList.toggle('idle',!run&&rr>0);
  const d=panel.querySelector('[data-tdisp]'),s=panel.querySelector('[data-tstate]'),b=panel.querySelector('[data-tbar]');
  const txt=fmt(rr);if(d.textContent!==txt)d.textContent=txt;if(s.textContent!==st)s.textContent=st;
  b.style.width=Math.min(100,t.dur?rr/t.dur*100:0)+'%';
  const back=scr.querySelector('[data-back]');
  if(back){const v=run&&rr>0?`Back at ${clockStr(t.end)}`:'';if(back.textContent!==v)back.textContent=v}
}
function tick(){
  const now=Date.now();let changed=false;
  for(const id in S.timers){const t=S.timers[id];
    if(t.end&&t.end<=now){t.end=null;t.rem=0;changed=true}
    if(!t.end&&t.rem===0&&!t.fin){t.fin=true;changed=true;   // reached zero (countdown or the − key)
      if(t===curT()){
        // Heist clock hits zero on the Heist screen: fire the twist alarm automatically
        if(id==='heist'&&!alerting)fireTwist();else timeUp();
      }}}
  if(changed)save();
  paintTimer();paintClock();
}
function timeUp(){chime();stage.classList.remove('flash');void stage.offsetWidth;stage.classList.add('flash')}

/* =========================================================
   NAVIGATION + GUARDS
   ========================================================= */
let armedUntil=0,armTimer=null;
function arm(){armedUntil=Date.now()+2500;$('armed').classList.add('on');clearTimeout(armTimer);armTimer=setTimeout(disarm,2500)}
function disarm(){armedUntil=0;$('armed').classList.remove('on')}
let alerting=false;
function go(i){
  if(alerting){if(i>S.step)endAlarm();return}   // → during the alarm skips straight to the twist screen
  i=Math.max(0,Math.min(PHASES.length-1,i));if(i===S.step)return;
  const from=cur(),to=PHASES[i];
  for(const k in S.timers)tPause(S.timers[k]);   // clocks only run on their own screen
  if(from.id==='heist'&&to.id==='twist'){fireTwist();return}   // alarm every time you move into the twist
  S.step=i;save();render();
}
function fireTwist(){
  alerting=true;S.twistFired=true;S.step=IDX.twist;save();
  const a=$('alert');a.classList.add('on');siren();
  // flash with the siren for 3 s, then hold steady so people can look up and read it
  alarmTimers=[setTimeout(()=>a.classList.add('hold'),3000),setTimeout(endAlarm,CONFIG.twistAlarmSeconds*1000)];
}
let alarmTimers=[];
function endAlarm(){
  if(!alerting)return;
  alarmTimers.forEach(clearTimeout);alarmTimers=[];
  $('alert').classList.remove('on','hold');alerting=false;tStart(S.timers.twist);save();render();
}
function selectCrew(n){
  if(n<0||n>=MISSIONS.length)return;
  if(S.crew!==n){S.crew=n;tReset(S.timers.reveal);blip()}
  save();render();
}
function toggleDone(){
  if(S.crew<0)return;
  const i=S.done.indexOf(S.crew);
  if(i>=0)S.done.splice(i,1);else{S.done.push(S.crew);tPause(S.timers.reveal)}
  save();render();
}

/* =========================================================
   OVERLAYS
   ========================================================= */
let toastT=null;
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),1700)}
function buildHelp(){
  const rows=[['→  /  Page Down','Next phase'],['←  /  Page Up','Previous phase'],['Space','Start / pause timer'],['+  /  −','Add / remove 1 minute'],['R  R','Reset timer (press twice)'],['F','Full screen'],['B  or  .','Blank screen'],['M','Sound on / off'],['1–6','Reveal: select crew (resets pitch clock)'],['D','Reveal: mark pitch done'],['1–2  /  0','Vault: spotlight a question / clear'],['H  or  ?','This help'],['Shift+R  ×2','Reset the entire session']];
  $('help').innerHTML=`<div class="box panel"><h3>Mission Control · Keys</h3><dl>${rows.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>
  <div class="h-note">From The Heist, → (or the clock reaching zero) fires the twist alarm.<br>Clocks only run on their own screen. Reopening the page starts fresh; a refresh within 10 minutes resumes.</div></div>`;
}

/* =========================================================
   KEYBOARD
   ========================================================= */
let lastR=0,lastShiftR=0;
document.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  ac();wake();
  const k=e.key,help=$('help'),blank=$('blank');
  if(help.classList.contains('on')&&!['h','H','?','Escape'].includes(k)){help.classList.remove('on')}
  if(blank.classList.contains('on')&&!['b','B','.'].includes(k))blank.classList.remove('on');
  const t=curT(),p=cur();
  let handled=true;
  switch(k){
    case 'ArrowRight':case 'PageDown':go(S.step+1);break;
    case 'ArrowLeft':case 'PageUp':go(S.step-1);break;
    case ' ':case 'Spacebar':
      if(t){if(t.end)tPause(t);else if(rem(t)>0)tStart(t);save();paintTimer()}break;
    case '+':case '=':if(t){tAdd(t,60);save();paintTimer();toast('+1 minute')}break;
    case '-':case '_':if(t){tAdd(t,-60);save();paintTimer();toast('−1 minute')}break;
    case 'r':case 'R':
      if(e.shiftKey){if(Date.now()-lastShiftR<1500){lastShiftR=0;fullReset()}else{lastShiftR=Date.now();toast('Shift+R again resets the whole session')}}
      else if(t){if(Date.now()-lastR<1500){tReset(t);lastR=0;save();paintTimer();toast('Timer reset')}else{lastR=Date.now();toast('Press R again to reset timer')}}
      break;
    case 'f':case 'F':toggleFs();break;
    case 'b':case 'B':case '.':blank.classList.toggle('on');break;
    case 'm':case 'M':S.muted=!S.muted;save();toast(S.muted?'Sound off':'Sound on');if(!S.muted)blip();syncMusic();break;
    case 'h':case 'H':case '?':help.classList.toggle('on');break;
    case 'Escape':help.classList.remove('on');break;
    case 'd':case 'D':if(p.id==='reveal')toggleDone();break;
    case '0':if(p.id==='vault'){tPause(S.timers.vault2);S.vault=-1;save();render()}break;
    default:
      if(/^[1-9]$/.test(k)){const n=+k-1;
        if(p.id==='reveal')selectCrew(n);
        else if(p.id==='vault'&&n<VAULT.length){const before=curT();S.vault=S.vault===n?-1:n;if(curT()!==before)tPause(before);save();render()}
      }else handled=false;
  }
  if(handled)e.preventDefault();
});
function fullReset(){
  const muted=S.muted;S=freshState();S.muted=muted;disarm();save();render();toast('Session reset');
}
async function toggleFs(){
  try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}
  catch(_){toast('Press F11 for full screen')}
}

/* =========================================================
   STAGE SCALING, WAKE LOCK, CURSOR
   ========================================================= */
function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080);stage.style.transform=`translate(${(innerWidth-1920*s)/2}px,${(innerHeight-1080*s)/2}px) scale(${s})`}
addEventListener('resize',fit);
document.addEventListener('fullscreenchange',()=>{fit();document.body.classList.toggle('fs',!!document.fullscreenElement)});
$('fsBtn').addEventListener('click',e=>{toggleFs();e.currentTarget.blur()});
let wl=null;
async function wake(){try{if('wakeLock' in navigator&&!wl&&document.visibilityState==='visible'){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null})}}catch(_){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')wake()});
let idleT=null;
function poke(){document.body.classList.remove('idle');clearTimeout(idleT);idleT=setTimeout(()=>document.body.classList.add('idle'),2000)}
document.addEventListener('mousemove',poke);

/* =========================================================
   BOOT
   ========================================================= */
load();buildHelp();renderHud();fit();render();paintClock();poke();wake();
setInterval(tick,200);
setInterval(save,15000);   // keeps the resume window fresh during long phases
})();
</script>
